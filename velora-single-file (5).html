<!DOCTYPE html><html lang="fa" dir="rtl"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>VELORA — دستیار هوشمند سبک زندگی لوکس</title>
<meta name="description" content="VELORA با هوش مصنوعی به شما در انتخاب عطر، برنامه‌ریزی مراسم، انتخاب هدیه و سبک زندگی کمک می‌کند."/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>/* =========================================================
   VELORA — Design tokens
   ========================================================= */
:root{
  --ivory:#F7F1E8;
  --cream:#FBF7F1;
  --espresso:#2B211B;
  --espresso-70: rgba(43,33,27,.7);
  --espresso-45: rgba(43,33,27,.45);
  --espresso-12: rgba(43,33,27,.12);
  --gold:#C9AD72;
  --gold-dark:#AD8F55;
  --sage:#BFC6B0;
  --sage-dark:#93997F;
  --beige:#E8DED0;
  --white:#FFFFFF;

  --serif:'Cormorant Garamond','Noto Serif','Vazirmatn',serif;
  --sans:'Vazirmatn','Inter',sans-serif;

  --radius-s:6px;
  --radius-m:14px;
  --radius-l:26px;
  --shadow-soft:0 18px 44px rgba(43,33,27,.09);
  --shadow-soft-lg:0 28px 70px rgba(43,33,27,.14);
  --container:1180px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--cream);
  color:var(--espresso);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.7;
  direction:rtl;
  -webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block;}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;}
h1,h2,h3,h4{
  font-family:var(--serif);
  font-weight:600;
  line-height:1.25;
  margin:0 0 .5em;
  letter-spacing:.2px;
}
p{margin:0 0 1em;color:var(--espresso-70);}
:focus-visible{outline:2px solid var(--gold-dark);outline-offset:3px;}
@media (prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
}

.container{max-width:var(--container);margin:0 auto;padding:0 28px;}
.brand-en{font-family:'Cormorant Garamond',serif;letter-spacing:.5px;direction:ltr;unicode-bidi:isolate;}
.eyebrow-en{
  font-family:'Cormorant Garamond',serif;
  direction:ltr;unicode-bidi:isolate;
  font-size:11px;letter-spacing:2.5px;color:var(--gold-dark);
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;gap:10px;
  padding:14px 30px;border-radius:999px;border:1px solid transparent;
  font-size:15px;font-weight:600;transition:transform .35s var(--ease),box-shadow .35s var(--ease),background .3s;
}
.btn-gold{background:var(--gold);color:var(--espresso);box-shadow:0 10px 26px rgba(201,173,114,.35);}
.btn-gold:hover{transform:translateY(-2px);box-shadow:0 14px 30px rgba(201,173,114,.45);}
.btn-outline{border-color:var(--espresso-12);background:transparent;color:var(--espresso);}
.btn-outline:hover{border-color:var(--espresso);}
.btn-ghost-light{border-color:rgba(43,33,27,.22);color:var(--espresso);background:rgba(255,255,255,.55);backdrop-filter:blur(6px);}
.btn-ghost-light:hover{background:rgba(255,255,255,.85);border-color:var(--espresso);}
.btn-sm{padding:10px 20px;font-size:13px;}

/* ---------- header ---------- */
.site-header{
  position:sticky;top:0;z-index:60;
  background:rgba(251,247,241,.7);
  backdrop-filter:blur(14px) saturate(140%);
  border-bottom:1px solid rgba(43,33,27,.06);
  transition:box-shadow .3s;
}
.site-header.is-scrolled{box-shadow:0 8px 30px rgba(43,33,27,.06);}
.header-inner{display:flex;align-items:center;justify-content:space-between;padding-top:18px;padding-bottom:18px;}
.brand-block{display:flex;flex-direction:column;gap:2px;}
.brand-name{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:700;letter-spacing:1px;direction:ltr;}
.brand-tagline{font-size:9.5px;letter-spacing:1.6px;color:var(--gold-dark);direction:ltr;text-transform:uppercase;}
.main-nav{display:flex;gap:36px;}
.main-nav a{font-size:15px;color:var(--espresso-70);position:relative;padding:4px 0;transition:color .25s;}
.main-nav a:hover,.main-nav a.active{color:var(--espresso);}
.main-nav a.active::after{content:"";position:absolute;right:0;left:0;bottom:-4px;height:1px;background:var(--gold);}
.header-actions{display:flex;align-items:center;gap:18px;}
.icon-btn{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--espresso-12);background:transparent;color:var(--espresso);transition:.25s;}
.icon-btn:hover{background:var(--espresso);color:var(--cream);}
.burger{display:none;background:none;border:none;padding:6px;}
.burger span{display:block;width:24px;height:1.5px;background:var(--espresso);margin:6px 0;transition:.3s;}

.mobile-menu{display:none;position:fixed;inset:0;background:var(--cream);z-index:80;padding:26px 28px;flex-direction:column;}
.mobile-menu.open{display:flex;}
.mobile-menu-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:40px;}
.mobile-menu nav{display:flex;flex-direction:column;gap:22px;}
.mobile-menu nav a{font-family:var(--serif);font-size:26px;}
.mobile-close{background:none;border:none;font-size:26px;color:var(--espresso);}

/* ---------- hero ---------- */
.hero{position:relative;min-height:92vh;display:flex;align-items:flex-end;overflow:hidden;color:var(--espresso);}
.hero-media{position:absolute;inset:0;background:var(--cream);}
.hero-media img{width:100%;height:100%;object-fit:cover;}
/* soft ivory-to-sage veil: keeps the photo visible but lets dark espresso text read cleanly */
.hero-media::after{content:"";position:absolute;inset:0;background:
  linear-gradient(180deg,
    rgba(251,247,241,.34) 0%,
    rgba(247,241,232,.66) 42%,
    rgba(240,236,226,.88) 74%,
    rgba(228,231,219,.95) 100%);}
.hero-content{position:relative;z-index:2;padding-bottom:88px;width:100%;}
.hero-note{
  position:absolute;top:60px;left:40px;z-index:3;color:var(--espresso);
  font-family:'Cormorant Garamond',serif;font-style:italic;font-size:20px;opacity:.72;
  max-width:220px;line-height:1.5;
}
.hero-title{font-size:clamp(14px, calc(5vw - 2px), 58px);color:var(--espresso);max-width:none;margin-bottom:.3em;white-space:nowrap;}
.hero-desc{font-size:clamp(13px, 1.8vw, 18px);color:var(--espresso-70);max-width:560px;margin-bottom:34px;}
.hero-actions{display:flex;gap:16px;flex-wrap:wrap;}

/* ---------- section basics ---------- */
section{padding:110px 0;}
.section-head{max-width:640px;margin:0 auto 64px;text-align:center;}
.section-head h2{font-size:clamp(30px,4vw,44px);}
.section-head p{font-size:17px;}
.sage-bg{background:var(--sage);color:var(--espresso);}
.sage-bg p{color:var(--espresso-70);}

/* ---------- service cards ---------- */
.services-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;}
.service-card{
  background:var(--ivory);border-radius:var(--radius-l);overflow:hidden;
  box-shadow:var(--shadow-soft);transition:transform .45s var(--ease),box-shadow .45s var(--ease);
  display:flex;flex-direction:column;
}
.service-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-soft-lg);}
.service-card .img-wrap{aspect-ratio:4/3;overflow:hidden;}
.service-card .img-wrap img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);}
.service-card:hover .img-wrap img{transform:scale(1.06);}
.service-card .card-body{padding:32px 30px 34px;display:flex;flex-direction:column;flex:1;}
.service-card h3{font-size:24px;margin-bottom:12px;}
.service-card p{font-size:15px;flex:1;}
.service-link{margin-top:10px;font-weight:600;color:var(--gold-dark);font-size:14.5px;display:inline-flex;gap:8px;align-items:center;transition:gap .25s;}
.service-link:hover{gap:12px;}

/* ---------- steps ---------- */
.steps-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:46px;margin-top:10px;}
.step{text-align:center;}
.step-num{font-family:var(--serif);font-size:52px;color:var(--espresso);opacity:.28;line-height:1;margin-bottom:14px;}
.step h3{font-size:21px;margin-bottom:10px;}
.step p{font-size:15px;}

/* ---------- discovery / inspiration ---------- */
.discover-strip{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
.discover-item{position:relative;border-radius:var(--radius-m);overflow:hidden;aspect-ratio:3/4.4;}
.discover-item img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease);}
.discover-item:hover img{transform:scale(1.07);}
.discover-item::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(0,0,0,.55) 100%);}
.discover-item span{position:absolute;bottom:18px;right:18px;left:18px;color:#fff;font-family:var(--serif);font-size:19px;z-index:2;}

/* ---------- about ---------- */
.about-hero{display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:center;}
.about-hero img{border-radius:var(--radius-l);box-shadow:var(--shadow-soft);}
.values-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:22px;margin-top:20px;}
.value-item{text-align:center;padding:30px 14px;background:var(--ivory);border-radius:var(--radius-m);}
.value-item h4{font-size:19px;margin-bottom:6px;}
.value-item p{font-size:13.5px;margin:0;}

/* ---------- magazine ---------- */
.mag-toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:44px;flex-wrap:wrap;}
.mag-toolbar .flex-gap12{flex-wrap:wrap;row-gap:10px;}
.search-box{position:relative;flex:1;min-width:180px;max-width:340px;}
.search-box input{width:100%;padding:12px 44px 12px 16px;border-radius:999px;border:1px solid var(--espresso-12);background:var(--ivory);font-family:inherit;font-size:14px;}
.search-box svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);opacity:.5;}
.chip-row{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:8px 18px;border-radius:999px;border:1px solid var(--espresso-12);font-size:13.5px;background:transparent;color:var(--espresso-70);transition:.25s;}
.chip.active,.chip:hover{background:var(--espresso);color:var(--cream);border-color:var(--espresso);}
.sort-select{padding:10px 14px;border-radius:999px;border:1px solid var(--espresso-12);background:var(--ivory);font-family:inherit;font-size:13.5px;}

.featured-article{display:grid;grid-template-columns:1.1fr .9fr;gap:50px;align-items:center;margin-bottom:80px;padding-bottom:70px;border-bottom:1px solid var(--espresso-12);}
.featured-article img{border-radius:var(--radius-l);aspect-ratio:5/4;object-fit:cover;box-shadow:var(--shadow-soft);}
.article-meta{display:flex;gap:14px;align-items:center;font-size:13px;color:var(--gold-dark);margin-bottom:16px;}
.article-meta .dot{width:3px;height:3px;border-radius:50%;background:var(--espresso-45);}
.featured-article h2{font-size:34px;}

.articles-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:34px;}
.article-card img{border-radius:var(--radius-m);aspect-ratio:4/3;object-fit:cover;margin-bottom:18px;}
.article-card h3{font-size:20px;margin-bottom:8px;}
.article-card p{font-size:14.5px;}
.empty-note{text-align:center;padding:60px 0;color:var(--espresso-45);grid-column:1/-1;}

/* ---------- article detail ---------- */
.article-hero{max-width:820px;margin:0 auto;text-align:center;}
.article-hero h1{font-size:clamp(30px,4.4vw,46px);}
.article-hero img{width:100%;border-radius:var(--radius-l);margin:34px 0 46px;box-shadow:var(--shadow-soft);}
.article-body{max-width:720px;margin:0 auto;font-size:17.5px;line-height:1.95;}
.article-body p{color:var(--espresso);}
.article-body blockquote{margin:36px 0;padding:22px 28px;border-right:3px solid var(--gold);background:var(--ivory);border-radius:var(--radius-s);font-family:var(--serif);font-size:20px;}
.share-row{display:flex;gap:12px;justify-content:center;margin:50px 0;}
.related-wrap{max-width:1000px;margin:0 auto;}

/* ---------- contact ---------- */
.contact-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;}
.field{margin-bottom:22px;}
.field label{display:block;font-size:13.5px;margin-bottom:8px;color:var(--espresso-70);}
.field input,.field textarea,.field select{
  width:100%;padding:14px 16px;border-radius:var(--radius-s);border:1px solid var(--espresso-12);
  background:var(--ivory);font-family:inherit;font-size:15px;color:var(--espresso);transition:.25s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--gold-dark);}
.field textarea{min-height:140px;resize:vertical;}
.form-msg{margin-top:16px;padding:14px 16px;border-radius:var(--radius-s);font-size:14px;display:none;}
.form-msg.ok{display:block;background:rgba(191,198,176,.35);color:#48523a;}
.form-msg.err{display:block;background:rgba(180,60,40,.1);color:#8a2f1f;}
.contact-info-card{background:var(--ivory);border-radius:var(--radius-l);padding:40px;}
.contact-row{display:flex;gap:14px;align-items:flex-start;margin-bottom:22px;}
.contact-row strong{display:block;font-size:14px;margin-bottom:2px;}
.social-row{display:flex;gap:12px;margin-top:24px;}

/* ---------- footer ---------- */
.site-footer{background:var(--espresso);color:rgba(255,255,255,.72);padding:80px 0 30px;}
.footer-top{display:grid;grid-template-columns:1.3fr 1fr 1.3fr;gap:60px;margin-bottom:60px;}
.footer-top>div{min-width:0;}
.footer-brand .brand-name{color:#fff;}
.footer-brand .brand-tagline{margin-top:6px;display:block;}
.footer-brand p{color:rgba(255,255,255,.55);margin-top:18px;max-width:280px;font-size:14px;}
.footer-links h4{color:#fff;font-size:14px;font-family:var(--sans);font-weight:600;margin-bottom:18px;}
.footer-links ul{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px;}
.footer-links a{font-size:14.5px;color:rgba(255,255,255,.65);transition:.25s;}
.footer-links a:hover{color:var(--gold);}
.newsletter-box h4{color:#fff;font-family:var(--serif);font-size:22px;margin-bottom:14px;}
.newsletter-form{display:flex;gap:0;border-bottom:1px solid rgba(255,255,255,.3);padding-bottom:10px;}
.newsletter-form input{flex:1;background:transparent;border:none;color:#fff;font-family:inherit;font-size:15px;padding:8px 4px;}
.newsletter-form input::placeholder{color:rgba(255,255,255,.45);}
.newsletter-form button{background:none;border:none;color:var(--gold);font-weight:600;font-size:14px;}
.footer-social{display:flex;gap:12px;margin-top:22px;}
.footer-social a{width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;transition:.25s;}
.footer-social a:hover{background:var(--gold);border-color:var(--gold);color:var(--espresso);}
.footer-bottom{border-top:1px solid rgba(255,255,255,.12);padding-top:26px;display:flex;justify-content:space-between;font-size:13px;color:rgba(255,255,255,.45);flex-wrap:wrap;gap:10px;}

/* ---------- toast ---------- */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120%);background:var(--espresso);color:#fff;padding:14px 26px;border-radius:999px;font-size:14px;z-index:200;transition:transform .4s var(--ease);box-shadow:var(--shadow-soft-lg);}
.toast.show{transform:translateX(-50%) translateY(0);}

/* ---------- responsive ---------- */
/* ---------- keep titles / labels on a single line ---------- */
.hero-desc,
.section-head h2,
.section-head p,
.service-card h3,
.service-link,
.step h3,
.discover-item span,
.value-item h4,
.value-item p,
.article-card h3,
.featured-article h2,
.article-meta,
.main-nav a,
.mobile-menu nav a,
.brand-name,
.brand-tagline,
.btn,
.chip,
.footer-links a,
.newsletter-box h4,
.footer-bottom span{
  white-space:nowrap;
}
/* headings shrink to fit rather than overflow their container */
.section-head h2{font-size:clamp(20px,3.2vw,44px);}
.featured-article h2{font-size:clamp(19px,2.4vw,34px);}
.service-card h3,.article-card h3{font-size:clamp(16px,1.5vw,24px);}
.hero-desc{font-size:clamp(11px,1.25vw,18px);max-width:none;}
.section-head{max-width:none;}
.section-head p{font-size:clamp(11px,1.15vw,17px);}

/* on narrow screens forcing one line would overflow, so allow wrapping again */
@media (max-width:760px){
  .header-inner{gap:12px;}
  .brand-block{min-width:0;}
  .header-inner .brand-tagline{display:none;}
  .footer-bottom span{white-space:normal;}
  .hero-desc,
  .section-head h2,
  .section-head p,
  .service-card h3,
  .step h3,
  .value-item p,
  .article-card h3,
  .featured-article h2,
  .article-meta{
    white-space:normal;
  }
}

/* ---------- utility classes (extracted from formerly inline styles) ---------- */
.pt-70{padding-top:70px;}
.fs-38{font-size:38px;}
.fs-17{font-size:17px;}
.flex-gap12{display:flex;gap:12px;align-items:center;}
.w-full-center{width:100%;justify-content:center;}
.mobile-cta{margin-top:36px;justify-content:center;}
.center-row{justify-content:center;}
.related-title{font-size:28px;}

@media (max-width:980px){
  .main-nav,.header-actions .icon-btn:first-child{display:none;}
  .burger{display:block;}
  .services-grid,.steps-grid{grid-template-columns:1fr;}
  .discover-strip{grid-template-columns:repeat(2,1fr);}
  .about-hero,.contact-grid,.featured-article{grid-template-columns:1fr;}
  .values-grid{grid-template-columns:repeat(2,1fr);}
  .articles-grid{grid-template-columns:repeat(2,1fr);}
  .footer-top{grid-template-columns:1fr;gap:36px;}
  .hero-note{display:none;}
}
@media (max-width:560px){
  .discover-strip{grid-template-columns:1fr;}
  .articles-grid{grid-template-columns:1fr;}
  .header-actions{gap:10px;}
  section{padding:72px 0;}
  .hero-actions{flex-direction:column;align-items:stretch;}
  .hero-actions .btn{justify-content:center;}
}


/* ================= admin.css ================= */
/* ================= VELORA Admin Panel ================= */
body.admin{background:var(--ivory);}

/* ---------- login ---------- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.login-card{width:100%;max-width:420px;background:var(--cream);border-radius:var(--radius-l);box-shadow:var(--shadow-soft-lg);padding:48px 40px;}
.login-logo{text-align:center;margin-bottom:36px;}
.login-logo .brand-name{font-size:30px;}
.login-logo .brand-tagline{display:block;margin-top:6px;}
.pw-wrap{position:relative;}
.pw-wrap button{position:absolute;left:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--espresso-45);font-size:13px;}
.login-row-between{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;margin-bottom:26px;}
.login-row-between a{color:var(--gold-dark);}
.check-row{display:flex;align-items:center;gap:8px;}
.demo-box{margin-top:26px;padding:16px 18px;background:var(--ivory);border-radius:var(--radius-s);font-size:12.5px;color:var(--espresso-70);line-height:2;}

/* ---------- shell ---------- */
.admin-shell{display:grid;grid-template-columns:264px 1fr;min-height:100vh;}
.admin-sidebar{background:var(--espresso);color:rgba(255,255,255,.72);padding:28px 20px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;}
.admin-sidebar .brand-name{color:#fff;font-size:24px;}
.admin-sidebar .brand-tagline{display:block;margin:4px 0 30px;}
.admin-nav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto;}
.admin-nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-size:14.5px;color:rgba(255,255,255,.68);transition:.2s;}
.admin-nav a svg{flex-shrink:0;}
.admin-nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
.admin-nav a.active{background:var(--gold);color:var(--espresso);font-weight:600;}
.admin-nav .nav-divider{height:1px;background:rgba(255,255,255,.1);margin:12px 4px;}
.sidebar-bottom{display:flex;flex-direction:column;gap:4px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);}

.admin-main{min-width:0;}
.admin-topbar{position:sticky;top:0;z-index:10;background:rgba(251,247,241,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--espresso-12);display:flex;align-items:center;justify-content:space-between;padding:18px 34px;}
.admin-topbar h1{font-size:24px;margin:0;}
.topbar-user{display:flex;align-items:center;gap:12px;font-size:13.5px;}
.role-badge{padding:4px 12px;border-radius:999px;font-size:11.5px;background:var(--sage);color:var(--espresso);}
.role-badge.super{background:var(--gold);}
.admin-content{padding:34px;max-width:1180px;}

  function load(){
    try{
      const raw = localStorage.getItem(DB_KEY);
      if(!raw) { const s = seed(); localStorage.setItem(DB_KEY, JSON.stringify(s)); return s; }
      return JSON.parse(raw);
    }catch(e){ const s = seed(); localStorage.setItem(DB_KEY, JSON.stringify(s)); return s; }
  }
  function save(db){
    try{
      localStorage.setItem(DB_KEY, JSON.stringify(db));
      return true;
    }catch(e){
      // مهم‌ترین حالت: پرشدن فضای ذخیره‌سازی مرورگر (QuotaExceededError).
      // به‌جای پرت‌کردن خطا و از کار افتادن صفحه، false برمی‌گردانیم تا
      // فراخوان بتواند پیام قابل‌فهم به کاربر نشان دهد.
      console.warn("VELORA: ذخیره‌سازی ناموفق بود —", e && e.name);
      return false;
    }
  }

  // حجم تقریبی استفاده‌شده و باقی‌مانده‌ی فضای مرورگر (برحسب بایت)
  function storageInfo(){
    const used = (localStorage.getItem(DB_KEY) || "").length * 2; // UTF-16
    const limit = 5 * 1024 * 1024;
    return { used, limit, freeRatio: Math.max(0, 1 - used/limit) };
  }

  function log(action, entity_type, entity_id, old_value, new_value){
    const db = load();
    const user = window.VELORA_AUTH ? window.VELORA_AUTH.currentUser() : null;
    db.activity_logs.unshift({
      id: uid("log"),
      user_id: user? user.id : "guest",
      user_name: user? user.full_name : "بازدیدکننده سایت",
      user_role: user? user.role : "-",
      action, entity_type, entity_id: entity_id||"",
      old_value: old_value? JSON.stringify(old_value): "",
      new_value: new_value? JSON.stringify(new_value): "",
      metadata:"", created_at: now()
    });
    save(db);
  }

  function mediaUrl(id){
    const db = load();
    const m = db.media_assets.find(x=>x.id===id);
    return m ? m.file_url : "";
  }
  function mediaAlt(id){
    const db = load();
    const m = db.media_assets.find(x=>x.id===id);
    return m ? (m.alt_text||"") : "";
  }

  window.VELORA_DB = { load, save, log, uid, now, mediaUrl, mediaAlt, storageInfo, resetSeed: ()=>{ save(seed()); } };
})(window);

/* =========================================================
   VELORA — لایه‌ی احراز هویت (شبیه‌سازی‌شده در مرورگر)
   ---------------------------------------------------------
   مهم: این یک شبیه‌سازیِ واقع‌گرایانه از احراز هویت است، نه
   احراز هویت واقعیِ سمت‌سرور. رمزها اینجا صرفاً برای دمو در
   localStorage نگهداری می‌شوند. برای استفاده‌ی واقعی، این لایه
   باید با یک سرویس Auth واقعی (مثل Supabase Auth) با هش رمز،
   Session امن و بررسی نقش در سرور جایگزین شود؛ همان‌طور که در
   بریف پروژه هم به‌درستی الزام شده است.
   ========================================================= */
(function(window){
  const SESSION_KEY = "velora_session_v1";
  const MAX_ATTEMPTS = 5;
  const LOCK_MS = 60000;

  function attemptsKey(email){ return "velora_attempts_"+email; }

  function getAttempts(email){
    try{ return JSON.parse(sessionStorage.getItem(attemptsKey(email))||'{"count":0,"lockedUntil":0}'); }
    catch(e){ return {count:0,lockedUntil:0}; }
  }
  function setAttempts(email,data){ sessionStorage.setItem(attemptsKey(email), JSON.stringify(data)); }

  // پیش‌فرض: نشست در sessionStorage ذخیره می‌شود، یعنی با بستن تب/مرورگر
  // پاک می‌شود و دفعه‌ی بعد دوباره باید وارد شوید. فقط وقتی «مرا به خاطر
  // بسپار» تیک بخورد، نشست در localStorage ذخیره می‌شود و بین بازدیدها
  // (حتی بعد از بستن کامل مرورگر) باقی می‌ماند.
  function login(email, password, remember){
    const db = window.VELORA_DB.load();
    const info = getAttempts(email);
    if(info.lockedUntil && Date.now() < info.lockedUntil){
      const secs = Math.ceil((info.lockedUntil-Date.now())/1000);
      return {ok:false, error:`به‌دلیل تلاش‌های ناموفق زیاد، ورود موقتاً قفل شده است. ${secs} ثانیه دیگر تلاش کنید.`};
    }
    const user = db.profiles.find(u=>u.email.toLowerCase()===String(email).toLowerCase());
    if(!user || !user.is_active || user.password !== password){
      info.count = (info.count||0)+1;
      if(info.count >= MAX_ATTEMPTS){ info.lockedUntil = Date.now()+LOCK_MS; info.count = 0; }
      setAttempts(email, info);
      window.VELORA_DB.log("ورود ناموفق","auth","", "", {email});
      return {ok:false, error: !user ? "ایمیل یا رمز عبور نادرست است." : (!user.is_active ? "این حساب غیرفعال شده است." : "ایمیل یا رمز عبور نادرست است.")};
    }
    setAttempts(email, {count:0, lockedUntil:0});
    user.last_login_at = window.VELORA_DB.now();
    window.VELORA_DB.save(db);
    const session = { id:user.id, full_name:user.full_name, email:user.email, role:user.role, ts:Date.now() };
    // هر دو را پاک می‌کنیم تا نشست قبلی (با حالت دیگر remember) باقی نماند
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_KEY);
    (remember ? localStorage : sessionStorage).setItem(SESSION_KEY, JSON.stringify(session));
    window.VELORA_DB.log("ورود","auth", user.id);
    return {ok:true, user:session};
  }

  function currentUser(){
    try{
      const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
      const s = JSON.parse(raw);
      if(!s) return null;
      // re-validate against DB in case role/active changed
      const db = window.VELORA_DB.load();
      const fresh = db.profiles.find(u=>u.id===s.id);
      if(!fresh || !fresh.is_active) { logout(false); return null; }
      return { id:fresh.id, full_name:fresh.full_name, email:fresh.email, role:fresh.role };
    }catch(e){ return null; }
  }

  function logout(shouldLog){
    const u = currentUser();
    if(shouldLog!==false && u) window.VELORA_DB.log("خروج","auth", u.id);
    sessionStorage.removeItem(SESSION_KEY);
    localStorage.removeItem(SESSION_KEY);
  }

  function requireAuth(minRole){
    const u = currentUser();
    if(!u){ window.location.hash = "#/admin/login"; return null; }
    if(minRole==="super_admin" && u.role!=="super_admin"){
      window.location.hash = "#/admin/dashboard";
      return null;
    }
    return u;
  }

  window.VELORA_AUTH = { login, logout, currentUser, requireAuth };
})(window);

  function subscribeNewsletter(email, form){
    const data = DB.load();
    email = (email||"").trim().toLowerCase();
    const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    if(!valid){ toast("ایمیل وارد شده معتبر نیست."); return; }
    if(data.newsletter_subscribers.some(s=>s.email.toLowerCase()===email)){
      toast("این ایمیل قبلاً عضو خبرنامه شده است.");
      return;
    }
    data.newsletter_subscribers.push({id:DB.uid("n"), email, status:"active", subscribed_at:DB.now(), unsubscribed_at:null});
    DB.save(data);
    DB.log("عضویت در خبرنامه","newsletter_subscribers","", "", {email});
    form.reset();
    toast("عضویت شما با موفقیت ثبت شد. سپاس از همراهی شما 🤍");
  }

  function toast(msg){
    let t = document.querySelector(".toast");
    if(!t){ t=document.createElement("div"); t.className="toast"; document.body.appendChild(t); }
    t.textContent = msg;
    requestAnimationFrame(()=>t.classList.add("show"));
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove("show"), 3200);
  }
  window.veloraToast = toast;

  /* ---------- Magazine listing ---------- */
  function fmtDate(iso){
    try{ return new Intl.DateTimeFormat("fa-IR",{year:"numeric",month:"long",day:"numeric"}).format(new Date(iso)); }
    catch(e){ return ""; }
  }

  function renderMagazine(){
    const featuredHost = document.getElementById("featuredArticle");
    const listHost = document.getElementById("articlesGrid");
    if(!listHost) return;
    const categories = ["همه","عطر و رایحه","مراسم و مهمانی","هدیه","سفر","سبک زندگی","راهنمای انتخاب"];
    const chipRow = document.getElementById("categoryChips");
    const params = new URLSearchParams(location.search);
    let activeCat = routeParams.cat || params.get("cat") || "همه";
    chipRow.innerHTML = categories.map(c=>`<button class="chip ${c===activeCat?'active':''}" data-cat="${c}">${c}</button>`).join("");

    const searchInput = document.getElementById("magSearch");
    const sortSelect = document.getElementById("magSort");

    function draw(){
      let list = db.articles.filter(a=>a.status==="published");
      const q = (searchInput.value||"").trim();
      if(q) list = list.filter(a=> a.title.includes(q) || a.excerpt.includes(q));
      if(activeCat && activeCat!=="همه") list = list.filter(a=>a.category===activeCat);

      const featured = db.articles.find(a=>a.featured && a.status==="published");
      if(featuredHost){
        if(featured){
          featuredHost.style.display="";
          featuredHost.innerHTML = `
            <img src="${DB.mediaUrl(featured.featured_image_id)}" alt="${DB.mediaAlt(featured.featured_image_id)}"/>
            <div>
              <div class="article-meta"><span>${featured.category}</span><span class="dot"></span><span>${fmtDate(featured.published_at)}</span><span class="dot"></span><span>${featured.reading_time} دقیقه مطالعه</span></div>
              <h2>${featured.title}</h2>
              <p>${featured.excerpt}</p>
              <a class="btn btn-outline" href="#/article/${featured.slug}">ادامه مطلب</a>
            </div>`;
        } else { featuredHost.style.display="none"; }
      }

      if(sortSelect.value==="popular"){
        list = list.slice().sort((a,b)=> (b.reading_time - a.reading_time));
      } else {
        list = list.slice().sort((a,b)=> new Date(b.published_at)-new Date(a.published_at));
      }
      if(featured) list = list.filter(a=>a.id!==featured.id || q || (activeCat!=="همه"));

      listHost.innerHTML = list.length ? list.map(a=>`
        <a class="article-card" href="#/article/${a.slug}">
          <img src="${DB.mediaUrl(a.featured_image_id)}" alt="${DB.mediaAlt(a.featured_image_id)}" loading="lazy"/>
          <div class="article-meta"><span>${a.category}</span><span class="dot"></span><span>${fmtDate(a.published_at)}</span></div>
          <h3>${a.title}</h3>
          <p>${a.excerpt}</p>
        </a>`).join("") : `<div class="empty-note">مقاله‌ای با این مشخصات پیدا نشد.</div>`;
    }

    chipRow.addEventListener("click", (e)=>{
      const btn = e.target.closest(".chip");
      if(!btn) return;
      activeCat = btn.dataset.cat;
      [...chipRow.children].forEach(c=>c.classList.toggle("active", c===btn));
      draw();
    });
    searchInput.addEventListener("input", draw);
    sortSelect.addEventListener("change", draw);
    draw();
  }

  /* ---------- Article detail ---------- */
  function renderArticleDetail(){
    const host = document.getElementById("articleRoot");
    if(!host) return;
    const slug = routeParams.slug || new URLSearchParams(location.search).get("slug");
    const article = db.articles.find(a=>a.slug===slug && a.status==="published");
    if(!article){
      host.innerHTML = `<div class="empty-note">این مقاله یافت نشد یا منتشر نشده است. <a href="#/magazine">بازگشت به مجله</a></div>`;
      return;
    }
    document.title = `${article.seo_title || article.title} — VELORA`;
    const metaDesc = document.querySelector('meta[name="description"]');
    if(metaDesc) metaDesc.setAttribute("content", article.seo_description || article.excerpt);

    const author = db.profiles.find(p=>p.id===article.author_id);
    const paragraphs = article.content.split("\n\n").map(p=>{
      if(p.startsWith("«") && p.endsWith("»")) return `<blockquote>${p}</blockquote>`;
      return `<p>${p}</p>`;
    }).join("");

    host.innerHTML = `
      <div class="article-hero">
        <div class="article-meta center-row">
          <span>${article.category}</span><span class="dot"></span><span>${author? author.full_name:""}</span><span class="dot"></span><span>${fmtDate(article.published_at)}</span><span class="dot"></span><span>${article.reading_time} دقیقه مطالعه</span>
        </div>
        <h1>${article.title}</h1>
        <img src="${DB.mediaUrl(article.featured_image_id)}" alt="${DB.mediaAlt(article.featured_image_id)}"/>
      </div>
      <div class="article-body">${paragraphs}</div>
      <div class="share-row">
        <a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="https://api.whatsapp.com/send?text=${encodeURIComponent(article.title+" — "+location.href)}">اشتراک در واتس‌اپ</a>
        <a class="btn btn-outline btn-sm" target="_blank" rel="noopener" href="https://t.me/share/url?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(article.title)}">اشتراک در تلگرام</a>
        <button class="btn btn-outline btn-sm" id="copyLinkBtn">کپی لینک</button>
      </div>
      <div class="related-wrap">
        <div class="section-head"><h2 class="related-title">مقالات مرتبط</h2></div>
        <div class="articles-grid" id="relatedGrid"></div>
      </div>`;

    document.getElementById("copyLinkBtn")?.addEventListener("click", ()=>{
      navigator.clipboard?.writeText(location.href).then(()=>toast("لینک کپی شد."));
    });

    const related = db.articles.filter(a=>a.status==="published" && a.id!==article.id && a.category===article.category).slice(0,3);
    const fallback = related.length? related : db.articles.filter(a=>a.status==="published" && a.id!==article.id).slice(0,3);
    document.getElementById("relatedGrid").innerHTML = fallback.map(a=>`
      <a class="article-card" href="#/article/${a.slug}">
        <img src="${DB.mediaUrl(a.featured_image_id)}" alt="${DB.mediaAlt(a.featured_image_id)}" loading="lazy"/>
        <h3>${a.title}</h3><p>${a.excerpt}</p>
      </a>`).join("");
  }

  /* ---------- Contact page ---------- */
  function renderContactPage(){
    const s = settings;
    setText("contactEmail", s.contact_email);
    setText("contactPhone", s.phone);
    setText("contactAddress", s.address);
    const igEl = document.getElementById("contactSocial");
    if(igEl){
      igEl.innerHTML = `
        <a href="${s.social_links.instagram}" target="_blank" rel="noopener">${ICONS.instagram}</a>
        <a href="${s.social_links.linkedin}" target="_blank" rel="noopener">${ICONS.linkedin}</a>
        <a href="${s.social_links.x}" target="_blank" rel="noopener">${ICONS.x}</a>`;
    }
    const form = document.getElementById("contactForm");
    if(form){
      form.addEventListener("submit", (e)=>{
        e.preventDefault();
        const fd = new FormData(form);
        const name = fd.get("name").trim();
        const email = fd.get("email").trim();
        const subject = fd.get("subject").trim();
        const message = fd.get("message").trim();
        const msgBox = document.getElementById("contactFormMsg");
        const valid = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        if(!name || !valid || !message){
          msgBox.className = "form-msg err";
          msgBox.textContent = "لطفاً نام، ایمیل معتبر و متن پیام را کامل وارد کنید.";
          return;
        }
        const data = DB.load();
        data.contact_messages.push({id:DB.uid("msg"), name, email, subject, message, created_at: DB.now(), status:"new"});
        DB.save(data);
        DB.log("پیام تماس جدید","contact_messages","", "", {name,email});
        msgBox.className = "form-msg ok";
        msgBox.textContent = "پیام شما با موفقیت ارسال شد. تیم VELORA به‌زودی با شما تماس می‌گیرد.";
        form.reset();
      });
    }
  }

  /* ---------- init ---------- */
  renderHeader();
  renderFooter();
  if(page==="home") renderHome();

  // اگر درست از دکمه‌ی «ثبت و مشاهده در سایت» در پنل مدیریت به اینجا آمده‌ایم،
  // یک تأییدیه نشان می‌دهیم که تغییرات واقعاً روی سایت اعمال شده‌اند
  if(page==="home"){
    const justSavedMsg = sessionStorage.getItem("velora_just_saved");
    if(justSavedMsg){
      sessionStorage.removeItem("velora_just_saved");
      setTimeout(()=> toast(justSavedMsg), 300);
    }
  }
  if(page==="services") renderServicesPage();
  if(page==="about") renderAboutPage();
  if(page==="magazine") renderMagazine();
  if(page==="article") renderArticleDetail();
  if(page==="contact") renderContactPage();

  // smooth-scroll for in-page hero CTA (routes always start with "#/", plain
  // in-page anchors like "#services" have no slash, so there is no clash)
  if(!window._veloraScrollBound){
    window._veloraScrollBound = true;
    document.addEventListener("click",(e)=>{
      const a = e.target.closest('a[href^="#"]');
      if(a){
        const id = a.getAttribute("href").slice(1);
        const target = document.getElementById(id);
        if(target){ e.preventDefault(); target.scrollIntoView({behavior:"smooth"}); }
      }
    });
  }
};

          + (warn ? `<span class="storage-warn">فضا رو به اتمام است — تصاویر بلااستفاده را حذف کنید.</span>` : ``);

    /* تصویر را قبل از ذخیره برای وب بهینه می‌کند:
       - حداکثر بُعد ۱۶۰۰ پیکسل (کافی برای Hero تمام‌عرض)
       - خروجی WEBP و در صورت پشتیبانی‌نشدن JPEG
       این کار حجم یک عکس ۲ مگابایتی را به حدود ۲۰۰ کیلوبایت می‌رساند،
       وگرنه فضای ذخیره‌سازی مرورگر با یکی دو عکس پر می‌شود. */
    function optimizeImage(file, maxDim, quality){
      return new Promise((resolve, reject)=>{
        const reader = new FileReader();
        reader.onerror = ()=>reject(new Error("خواندن فایل ناموفق بود"));
        // SVG برداری است و نباید به تصویر نقطه‌ای تبدیل شود
        if(file.type === "image/svg+xml"){
          reader.onload = ()=>resolve({url:reader.result, width:0, height:0, type:file.type});
          reader.readAsDataURL(file);
          return;
        }
        reader.onload = ()=>{
          const img = new Image();
          img.onerror = ()=>reject(new Error("فایل تصویر معتبر نیست"));
          img.onload = ()=>{
            const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
            const w = Math.max(1, Math.round(img.width * scale));
            const h = Math.max(1, Math.round(img.height * scale));
            const canvas = document.createElement("canvas");
            canvas.width = w; canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            let url = canvas.toDataURL("image/webp", quality);
            let type = "image/webp";
            if(url.indexOf("data:image/webp") !== 0){   // مرورگر WEBP را پشتیبانی نمی‌کند
              url = canvas.toDataURL("image/jpeg", quality);
              type = "image/jpeg";
            }
            resolve({url, width:w, height:h, type});
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFiles(files){
      for(const f of [...files]){
        const okType = ["image/png","image/jpeg","image/webp","image/svg+xml"].includes(f.type);
        if(!okType){ toast(`فرمت «${f.name}» پشتیبانی نمی‌شود.`); continue; }
        if(f.size > 10*1024*1024){ toast(`حجم «${f.name}» بیش از ۱۰ مگابایت است.`); continue; }

        toast(`در حال پردازش «${f.name}»...`);
        let out;
        try{
          out = await optimizeImage(f, 1600, 0.82);
        }catch(err){
          toast(`پردازش «${f.name}» ناموفق بود.`);
          continue;
        }

        const db = DB.load();
        const rec = {
          id: DB.uid("img"),
          file_name: f.name,
          file_url: out.url,
          file_type: out.type,
          file_size: Math.round(out.url.length * 0.75), // حجم تقریبی پس از فشرده‌سازی
          width: out.width || 0,
          height: out.height || 0,
          alt_text:"", title: f.name.replace(/\.[^.]+$/,""), description:"",
          usage_area:"عمومی", uploaded_by:user.id,
          created_at:DB.now(), updated_at:DB.now()
        };
        db.media_assets.unshift(rec);

        if(!persist(db)){
          // persist خودش پیام «فضای ذخیره‌سازی پر است» را نشان می‌دهد
          draw();
          continue;
        }
        DB.log("آپلود تصویر","media_assets", rec.id, "", {file_name:f.name});
        toast(`«${f.name}» با موفقیت آپلود شد.`);
        draw();
      }
    }

      if(db.discover_items.some(d=>d.image_id===id)) return true;
      if(db.articles.some(a=>a.featured_image_id===id)) return true;
      return false;
    }

      });
      document.getElementById("saveMediaBtn").addEventListener("click",()=>{

          const probe = new Image();
          probe.onload = ()=>{ m2.width = probe.naturalWidth; m2.height = probe.naturalHeight; finish(); };

          probe.src = newUrl;
        } else {
          finish();
        }
      });
    }

    function openAddByLink(){
      openModal(`
        <h3>افزودن تصویر با لینک</h3>
        <p style="color:var(--espresso-70);margin-bottom:16px;">آدرس تصویر را از هر جای دیگر (مثلاً سایت میزبان تصویر) اینجا بچسبانید. تصویر آپلود نمی‌شود، فقط لینک آن ذخیره می‌شود.</p>

          <div class="field"><label>متن جایگزین / Alt Text (اختیاری)</label><input id="link-alt" placeholder="توصیف کوتاه تصویر برای دسترسی‌پذیری"/></div>

          <button class="btn btn-outline btn-sm" onclick="veloraCloseModal()">انصراف</button>
          <button class="btn btn-gold btn-sm" id="saveLinkBtn">افزودن تصویر</button>
        </div>`);
      const urlInput = document.getElementById("link-url");
      const preview = document.getElementById("link-preview");
      urlInput.addEventListener("input", ()=>{
        const v = urlInput.value.trim();
        if(v){ preview.src = v; preview.classList.remove("hidden"); }
        else{ preview.classList.add("hidden"); }
      });
      document.getElementById("saveLinkBtn").addEventListener("click", ()=>{
        const url = urlInput.value.trim();
        if(!url){ toast("لطفاً آدرس تصویر را وارد کنید."); return; }
        if(!/^https?:\/\//i.test(url)){ toast("آدرس باید با http:// یا https:// شروع شود."); return; }
        const titleVal = document.getElementById("link-title").value.trim() || "تصویر بدون عنوان";
        const altVal = document.getElementById("link-alt").value.trim();
        const probe = new Image();
        const finish = (w,h)=>{
          const db = DB.load();
          const rec = {

  function moveItem(collection, id, dir){
    const db = DB.load();
    const list = db[collection].slice().sort((a,b)=>a.sort_order-b.sort_order);
    const idx = list.findIndex(x=>x.id===id);
    const swapIdx = dir==="up" ? idx-1 : idx+1;
    if(swapIdx<0 || swapIdx>=list.length) return;
    const tmp = list[idx].sort_order;
    list[idx].sort_order = list[swapIdx].sort_order;
    list[swapIdx].sort_order = tmp;
    persist(db);
    DB.log("تغییر ترتیب", collection, id);
  }

        p.classList.add("selected");
      });

        const {selectionStart:st, selectionEnd:en, value} = ta;
        const wrap = btn.dataset.wrap;
        const closing = wrap==="«" ? "»" : wrap;
        ta.value = value.slice(0,st)+wrap+value.slice(st,en)+closing+value.slice(en);

        const db2 = DB.load();
        const sel = document.querySelector(".modal-box .pick.selected");
        const wasPublished = id ? db2.articles.find(x=>x.id===id).status==="published" : false;
        const nowPublished = document.getElementById("a-status").classList.contains("on");
        const payload = {
          title: document.getElementById("a-title").value,
          slug: document.getElementById("a-slug").value.trim() || slugify(),
          excerpt: document.getElementById("a-excerpt").value,
          content: document.getElementById("a-content").value,
          category: document.getElementById("a-cat").value,
          reading_time: parseInt(document.getElementById("a-time").value)||4,

          seo_description: document.getElementById("a-seod").value,
          featured: document.getElementById("a-featured").classList.contains("on"),
          status: nowPublished ? "published":"draft"

          db2.articles.push(Object.assign({id:DB.uid("art")}, payload, {
            author_id:user.id, tags:[], created_at:DB.now(), updated_at:DB.now(),
            created_by:user.id, updated_by:user.id, published_at: nowPublished? DB.now(): null
          }));

  /* ============ USERS MANAGER (super_admin only) ============ */
  if(page==="users"){

      function draw(){
        const db = DB.load();
        content.innerHTML = `
          <table class="admin-table"><thead><tr><th>نام</th><th>ایمیل</th><th>نقش</th><th>آخرین ورود</th><th>وضعیت</th><th></th></tr></thead><tbody>
          ${db.profiles.map(p=>`<tr>
            <td>${esc(p.full_name)}</td><td>${esc(p.email)}</td>
            <td><select data-role="${p.id}" ${p.id===user.id?'disabled':''}><option value="editor" ${p.role==='editor'?'selected':''}>ویرایشگر</option><option value="super_admin" ${p.role==='super_admin'?'selected':''}>مدیر اصلی</option></select></td>

            <td><span class="status-pill ${p.is_active?'active':'inactive'}">${p.is_active?'فعال':'غیرفعال'}</span></td>

            </div></td>
          </tr>`).join("")}
          </tbody></table>
          <p class="note-muted">در این مرحله سیستم با دو حساب راه‌اندازی شده است؛ افزودن کاربر جدید در نسخه‌های بعدی از همین بخش فعال می‌شود.</p>
        `;
      }
      draw();

      function openUserEdit(id){
        const db = DB.load();
        const p = db.profiles.find(x=>x.id===id);
        openModal(`
          <h3>ویرایش کاربر</h3>
          <div class="admin-form">
            <div class="field"><label>نام کامل</label><input id="u-name" value="${esc(p.full_name)}"/></div>

            <div class="field"><label>رمز عبور جدید</label><input id="u-pass" type="password" placeholder="برای تغییر رمز پر کنید؛ در غیر این صورت خالی بگذارید"/></div>
            <div class="field"><label>تکرار رمز عبور جدید</label><input id="u-pass2" type="password" placeholder="تکرار رمز عبور جدید"/></div>

          </div>`);

        document.getElementById("saveUserBtn").addEventListener("click", ()=>{
          const name = document.getElementById("u-name").value.trim();
          const email = document.getElementById("u-email").value.trim();
          const pass = document.getElementById("u-pass").value;
          const pass2 = document.getElementById("u-pass2").value;
          const msgBox = document.getElementById("userEditMsg");
          const showErr = (t)=>{ msgBox.className = "form-msg err"; msgBox.textContent = t; };

          if(!name){ showErr("نام نمی‌تواند خالی باشد."); return; }
          const validEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
          if(!validEmail){ showErr("ایمیل معتبر نیست."); return; }
          const db2 = DB.load();
          const dup = db2.profiles.find(x=>x.id!==id && x.email.toLowerCase()===email.toLowerCase());
          if(dup){ showErr("این ایمیل قبلاً برای کاربر دیگری ثبت شده است."); return; }
          if(pass || pass2){
            if(pass.length < 6){ showErr("رمز عبور جدید باید حداقل ۶ کاراکتر باشد."); return; }
            if(pass !== pass2){ showErr("رمز عبور جدید و تکرار آن یکسان نیستند."); return; }
          }

          const rec = db2.profiles.find(x=>x.id===id);
          const oldInfo = {full_name: rec.full_name, email: rec.email};
          rec.full_name = name;
          rec.email = email;
          if(pass) rec.password = pass; // عمداً رمز در activity log ثبت نمی‌شود
          rec.updated_at = DB.now();
          if(!persist(db2)) return;
          DB.log("ویرایش کاربر","profiles", id, oldInfo, {full_name:name, email});

          // اگر مدیر، اطلاعات خودش را ویرایش کرده، نام بالای پنل هم بلافاصله به‌روز شود

          closeModal();
          toast("اطلاعات کاربر ذخیره شد." + (pass ? " رمز عبور هم تغییر کرد." : ""));
          draw();
        });
      }

          <div class="field"><label>توضیحات پیش‌فرض سئو</label><textarea id="st-seod" class="ta-h70">${esc(s.seo_description)}</textarea></div>
          <div class="field"><label>متن فوتر</label><input id="st-footer" value="${esc(s.footer_text)}"/></div>
        </div>
        <div class="card-block">
          <h3>تنظیمات امنیتی و سیستم</h3>
          <div class="toggle-row mb-14" ><div class="switch ${s.maintenance_mode?'on':''}" id="st-maint"></div><span>حالت تعمیرات</span></div>
          <p class="text-muted-sm">احراز هویت دومرحله‌ای، مدیریت نشست‌های فعال و کلیدهای اتصال سرویس‌های خارجی، در تنظیمات سطح سرور (نه در مرورگر) پیکربندی می‌شوند.</p>
        </div>
        <button class="btn btn-gold" id="saveSettings">ذخیره تنظیمات</button>
      `;
      document.getElementById("st-maint").addEventListener("click",e=>e.target.classList.toggle("on"));
      document.getElementById("saveSettings").addEventListener("click",()=>{
        const db2 = DB.load();
        const s2 = db2.site_settings;
        s2.brand_name = document.getElementById("st-brand").value;
        s2.tagline = document.getElementById("st-tagline").value;
        s2.contact_email = document.getElementById("st-email").value;
        s2.phone = document.getElementById("st-phone").value;
        s2.address = document.getElementById("st-address").value;
        s2.social_links = { instagram:document.getElementById("st-ig").value, linkedin:document.getElementById("st-li").value, x:document.getElementById("st-x").value };
        s2.seo_title = document.getElementById("st-seot").value;

        s2.maintenance_mode = document.getElementById("st-maint").classList.contains("on");
        s2.updated_at = DB.now(); s2.updated_by = user.id;
        persist(db2); DB.log("ویرایش تنظیمات عمومی","site_settings");
        toast("تنظیمات ذخیره شد.");
      });
    }
  }

};

  const ADMIN_LOGIN_TEMPLATE = `

  const ADMIN_SHELL_TEMPLATE = `<div class="admin-shell" id="adminShell"></div>`;

  function publicShell(inner){
    return `<header class="site-header" id="site-header"></header>${inner}<footer class="site-footer" id="site-footer"></footer>`;
  }

  function parseHash(){
    let h = (location.hash || "").replace(/^#/, "");
    if(!h) h = "/";
    const [path, queryStr] = h.split("?");
    const params = {};
    if(queryStr){
      new URLSearchParams(queryStr).forEach((v,k)=>{ params[k]=v; });
    }
    return {path, params};
  }

  const ADMIN_PAGES = ["login","dashboard","homepage","media","services","articles","newsletter","users","activity","settings"];

  function route(){
    const {path, params} = parseHash();
    const app = document.getElementById("app");
    window.scrollTo(0,0);

    if(path.startsWith("/admin")){
      let adminPage = path.replace(/^\/admin\/?/, "");
      if(!ADMIN_PAGES.includes(adminPage)) adminPage = "login";
      app.innerHTML = adminPage === "login" ? ADMIN_LOGIN_TEMPLATE : ADMIN_SHELL_TEMPLATE;
      document.body.className = "admin";
      window.VELORA_ADMIN_RUN(adminPage);
      return;
    }

    document.body.className = "";

    if(path === "/" ){
      app.innerHTML = publicShell(PUBLIC_TEMPLATES.home);
      window.VELORA_SITE_RUN("home", params);
    } else if(path === "/services"){
      app.innerHTML = publicShell(PUBLIC_TEMPLATES.services);
      window.VELORA_SITE_RUN("services", params);
    } else if(path === "/about"){
      app.innerHTML = publicShell(PUBLIC_TEMPLATES.about);
      window.VELORA_SITE_RUN("about", params);
    } else if(path === "/magazine"){
      app.innerHTML = publicShell(PUBLIC_TEMPLATES.magazine);
      window.VELORA_SITE_RUN("magazine", params);
    } else if(path.indexOf("/article/") === 0){
      const slug = decodeURIComponent(path.slice("/article/".length));
      app.innerHTML = publicShell(PUBLIC_TEMPLATES.article);
      params.slug = slug;
      window.VELORA_SITE_RUN("article", params);
    } else if(path === "/contact"){
      app.innerHTML = publicShell(PUBLIC_TEMPLATES.contact);
      window.VELORA_SITE_RUN("contact", params);
    } else {
      location.hash = "#/";
    }
  }

  window.addEventListener("hashchange", route);
  route();
})();
